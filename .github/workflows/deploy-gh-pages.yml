name: Deploy to GithubPages

on: pull_request
permissions:
  contents: write
jobs:
  deploy-to-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install Packages
        run: |
        working-directory: ./frontend
          npm install

      - name: Build
        run: |
        working-directory: ./frontend
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          working-directory: ./frontend
          folder: dist