name: PR Sanity Check

on: pull_request

jobs:
  lint:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Packages
        run: |
        working-directory: frontend
          npm install

      - name: Lint check
        run: |
        working-directory: frontend
          npm run lint

