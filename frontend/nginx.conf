server {
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /ot_click {
        alias /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /ot_click/index.html;
    }
}